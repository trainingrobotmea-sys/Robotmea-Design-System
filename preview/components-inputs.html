<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form Inputs" subtitle="Text input, select, error state" viewport="700x380" -->
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  .stack { display: flex; flex-direction: column; gap: 14px; max-width: 380px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); }
  .input, .select {
    border: 1.5px solid var(--border-1); background: white; padding: 11px 14px;
    border-radius: var(--radius-md); font-family: var(--font-body); font-size: 14px;
    color: var(--fg-1); outline: none; transition: border-color .14s;
  }
  .input:focus, .select:focus { border-color: var(--rm-blue); }
  .input.error { border-color: var(--rm-red); }
  .err { font-size: 11px; color: var(--rm-red); }
</style></head>
<body>
  <div class="stack">
    <div class="field">
      <label class="lbl">Full Name</label>
      <input class="input" value="Asma Khan">
    </div>
    <div class="field">
      <label class="lbl">School / Organisation</label>
      <input class="input" placeholder="e.g. Dubai American Academy">
    </div>
    <div class="field">
      <label class="lbl">Program of Interest</label>
      <select class="select"><option>School Program</option></select>
    </div>
    <div class="field">
      <label class="lbl">Email</label>
      <input class="input error" value="asma@">
      <span class="err">Enter a valid email address.</span>
    </div>
  </div>
</body></html>
