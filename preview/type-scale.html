<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type Scale" subtitle="48 → 12 — display + body samples" viewport="700x340" -->
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: 60px 1fr; gap: 14px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border-1); }
  .size { font-family: var(--font-mono); color: var(--fg-3); font-size: 10px; }
  .sample { color: var(--fg-1); font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
  .body-sample { font-family: var(--font-body); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg-2); }
</style></head>
<body>
  <div class="row"><span class="size">48 / D</span><span class="sample" style="font-size:48px">Robotmea</span></div>
  <div class="row"><span class="size">32 / D</span><span class="sample" style="font-size:32px">Robotmea</span></div>
  <div class="row"><span class="size">24 / D</span><span class="sample" style="font-size:24px">Robotmea</span></div>
  <div class="row"><span class="size">18 / B</span><span class="sample body-sample" style="font-size:18px">The quick brown fox jumps</span></div>
  <div class="row"><span class="size">16 / B</span><span class="sample body-sample" style="font-size:16px">The quick brown fox jumps over the lazy dog</span></div>
  <div class="row"><span class="size">14 / B</span><span class="sample body-sample" style="font-size:14px">The quick brown fox jumps over the lazy dog 1234567890</span></div>
  <div class="row"><span class="size">12 / B</span><span class="sample body-sample" style="font-size:12px">The quick brown fox jumps over the lazy dog 1234567890</span></div>
</body></html>
