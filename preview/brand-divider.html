<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Section Divider" subtitle="4-tick pillar bar + eyebrow + heading" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Section Divider</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-body); }
  .ticks { display: flex; gap: 4px; margin-bottom: 14px; }
  .tick { width: 28px; height: 4px; border-radius: 2px; }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--rm-orange); margin-bottom: 6px; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; text-transform: uppercase; letter-spacing: .02em; color: var(--fg-1); margin: 0; }
  .note { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 12px; }
</style></head>
<body>
  <div class="ticks">
    <div class="tick" style="background:var(--rm-blue)"></div>
    <div class="tick" style="background:var(--rm-orange)"></div>
    <div class="tick" style="background:var(--rm-green)"></div>
    <div class="tick" style="background:var(--rm-red)"></div>
  </div>
  <div class="eyebrow">What We Offer</div>
  <h2>Our Programs</h2>
  <div class="note">Brand divider — 4-tick pillar bar above section headings.</div>
</body></html>
