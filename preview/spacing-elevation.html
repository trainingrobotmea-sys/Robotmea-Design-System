<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation / Shadows" subtitle="5-step shadow system" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-2); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 100px; height: 70px; background: white; border-radius: var(--radius-lg); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); text-align: center; }
  .val { font-size: 9px; color: var(--fg-3); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-1)"></div><span class="tok">shadow-1</span><span class="val">cards</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-2)"></div><span class="tok">shadow-2</span><span class="val">hover</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-3)"></div><span class="tok">shadow-3</span><span class="val">modals</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-pop)"></div><span class="tok">shadow-pop</span><span class="val">blue glow</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-warm)"></div><span class="tok">shadow-warm</span><span class="val">orange CTA</span></div>
  </div>
</body></html>
