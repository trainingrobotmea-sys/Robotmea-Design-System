<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="sm 4 → pill 999" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 72px; background: var(--rm-blue-100); border: 2px solid var(--rm-blue); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .val { font-size: 10px; color: var(--fg-3); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><span class="tok">--radius-sm</span><span class="val">4px</span></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><span class="tok">--radius-md</span><span class="val">8px</span></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><span class="tok">--radius-lg</span><span class="val">14px</span></div>
    <div class="item"><div class="box" style="border-radius:22px"></div><span class="tok">--radius-xl</span><span class="val">22px</span></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><span class="tok">--radius-pill</span><span class="val">999px</span></div>
  </div>
</body></html>
