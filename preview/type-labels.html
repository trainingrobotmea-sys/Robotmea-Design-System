<!DOCTYPE html>
<!-- @dsCard group="Type" name="Eyebrows & Labels" subtitle="Section labels in orange caps" viewport="700x210" -->
<html><head><meta charset="utf-8"><title>Eyebrow & Labels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-body); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow-demo { font-family: var(--font-body); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--rm-orange); }
  .label-demo { font-family: var(--font-body); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .caption-demo { font-size: 12px; color: var(--fg-3); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body>
  <div class="stack">
    <div class="row">
      <span class="eyebrow-demo">What We Offer</span>
      <span class="meta">Eyebrow · 13px · 700 · +.08em · orange</span>
    </div>
    <div class="row">
      <span class="label-demo">Program Type</span>
      <span class="meta">Label · 12px · 700 · +.08em · ink-3</span>
    </div>
    <div class="row">
      <span class="caption-demo">Updated June 2024 · 5 countries · 200+ schools</span>
      <span class="meta">Caption · 12px · 400 · ink-3</span>
    </div>
  </div>
</body></html>
