<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, outline, pill" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; align-items: center; }
  .btn {
    font-family: var(--font-body); font-weight: 800; font-size: 13px;
    text-transform: uppercase; letter-spacing: .08em;
    padding: 12px 22px; border-radius: var(--radius-md); border: none;
    cursor: pointer; transition: all .14s var(--ease-out);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: var(--rm-orange); color: white; }
  .btn-primary:hover { background: var(--rm-orange-600); transform: translateY(-1px); }
  .btn-secondary { background: var(--rm-blue); color: white; }
  .btn-outline { background: transparent; color: var(--rm-blue); border: 2px solid var(--rm-blue); padding: 10px 20px; }
  .btn-ghost { background: transparent; color: var(--fg-2); }
  .btn-pill { border-radius: 999px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body>
  <div class="grid">
    <button class="btn btn-primary">Enroll Now →</button>
    <span class="lbl">Primary · orange / white</span>
    <button class="btn btn-secondary">Explore Programs</button>
    <span class="lbl">Secondary · blue / white</span>
    <button class="btn btn-outline">Learn More</button>
    <span class="lbl">Outline · blue border</span>
    <button class="btn btn-primary btn-pill">Partner With Us</button>
    <span class="lbl">Primary · pill variant</span>
  </div>
</body></html>
