<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Four Brand Pillars" subtitle="Ideas / Learning / Industry / Innovation" viewport="700x210" -->
<html><head><meta charset="utf-8"><title>Brand Pillars</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-1); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pillar { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 14px; color: white; min-height: 130px; }
  .icon { width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .sub { font-size: 10px; opacity: .9; text-align: center; line-height: 1.3; }
</style></head>
<body>
  <div class="grid">
    <div class="pillar" style="background:var(--rm-orange)">
      <div class="icon">💡</div>
      <div class="nm">Ideas</div>
      <div class="sub">Curiosity &amp;<br>creative thinking</div>
    </div>
    <div class="pillar" style="background:var(--rm-blue)">
      <div class="icon">🎓</div>
      <div class="nm">Learning</div>
      <div class="sub">STEAM<br>education</div>
    </div>
    <div class="pillar" style="background:var(--rm-green)">
      <div class="icon">🏭</div>
      <div class="nm">Industry</div>
      <div class="sub">IoT &amp; applied<br>technology</div>
    </div>
    <div class="pillar" style="background:var(--rm-red)">
      <div class="icon">⚙</div>
      <div class="nm">Innovation</div>
      <div class="sub">R&amp;D, robotics,<br>AI</div>
    </div>
  </div>
</body></html>
